[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "core_person"
description = "LinkML evaluation harness for SEMIC Core Person Vocabulary 2.1.2"
authors = [
  {name = "Nico Matentzoglu", email = "nicolas.matentzoglu@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dynamic = ["version"]

dependencies = [
  "linkml-runtime @ git+https://github.com/linkml/linkml.git@main#subdirectory=packages/linkml_runtime",
]

[project.scripts]
core-person-baseline = "core_person.baseline:main"

[dependency-groups]
dev = [
    "linkml @ git+https://github.com/linkml/linkml.git@main#subdirectory=packages/linkml",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "mkdocs-pymdownx-material-extras>=2.5.6",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
    "pyshacl==0.40.1",
    "rdflib==7.6.0",
]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.metadata]
# Required because project.dependencies pins linkml-runtime to a git URL
# (the project tracks linkml/linkml main by design — see
# .claude/skills/align-model/SKILL.md).
allow-direct-references = true

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/core_person/datamodel/core_person_pydantic.py",
  "src/core_person/datamodel/core_person.py",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/core_person/datamodel/core_person_pydantic.py",
  "src/core_person/datamodel/core_person.py",
]
