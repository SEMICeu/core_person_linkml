  rdf_literal:
    name: rdf_literal
    definition_uri: https://semiceu.github.io/Core-Person-Vocabulary/releases/2.1.2/linkml/RdfLiteral
    description: Any RDF literal. The SEMIC SHACL adapter emits only sh:nodeKind sh:Literal
      and intentionally removes the overly restrictive sh:datatype rdfs:Literal.
    from_schema: https://semiceu.github.io/Core-Person-Vocabulary/releases/2.1.2/linkml/core-person.yaml
    base: str
    uri: rdfs:Literal
  any_uri_literal:
    name: any_uri_literal
    definition_uri: https://semiceu.github.io/Core-Person-Vocabulary/releases/2.1.2/linkml/AnyUriLiteral
    description: An xsd:anyURI typed RDF literal. This is intentionally not an RDF
      IRI node.
    from_schema: https://semiceu.github.io/Core-Person-Vocabulary/releases/2.1.2/linkml/core-person.yaml
    base: str
    uri: xsd:anyURI
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
