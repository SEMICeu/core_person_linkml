id: https://semiceu.github.io/Core-Person-Vocabulary/releases/2.1.2/linkml/core-person.yaml
name: core_person_2_1_2
title: SEMIC Core Person Vocabulary 2.1.2 — LinkML candidate
version: 2.1.2
description: >-
  LinkML candidate for the SEMIC Core Person Vocabulary 2.1.2. The official
  SHACL distribution remains authoritative. This schema preserves its open,
  optional and multivalued property semantics; SEMIC generator extensions are
  used for sh:uniqueLang and unrestricted RDF literal constraints.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  cp212: https://semiceu.github.io/Core-Person-Vocabulary/releases/2.1.2/linkml/
  m8g: http://data.europa.eu/m8g/
  person: http://www.w3.org/ns/person#
  locn: http://www.w3.org/ns/locn#
  adms: http://www.w3.org/ns/adms#
  dct: http://purl.org/dc/terms/
  foaf: http://xmlns.com/foaf/0.1/
  skos: http://www.w3.org/2004/02/skos/core#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: cp212
default_range: rdf_literal
imports:
  - linkml:types

annotations:
  semic_source_release: Core Person 2.1.2
  semic_source_commit: a1b13f2bed9fd97b28420b0cef7f0032da08d148
  semic_authority: official SHACL distribution
  semic_profile: open shapes; all properties optional and multivalued

types:
  lang_string:
    uri: rdf:langString
    base: str
    description: An RDF language-tagged string.
  rdf_literal:
    uri: rdfs:Literal
    base: str
    description: >-
      Any RDF literal. The SEMIC SHACL adapter emits only sh:nodeKind sh:Literal
      and intentionally removes the overly restrictive sh:datatype rdfs:Literal.
  any_uri_literal:
    uri: xsd:anyURI
    base: str
    description: >-
      An xsd:anyURI typed RDF literal. This is intentionally not an RDF IRI node.

slots:
  administrative_unit:
    slot_uri: m8g:adminUnit
    range: AdministrativeUnit
    multivalued: true
  address_area:
    slot_uri: locn:addressArea
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}
  address_id:
    slot_uri: locn:addressId
    range: rdf_literal
    multivalued: true
  admin_unit_l1:
    slot_uri: locn:adminUnitL1
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}
  admin_unit_l2:
    slot_uri: locn:adminUnitL2
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}
  full_address:
    slot_uri: locn:fullAddress
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}
  locator_designator:
    slot_uri: locn:locatorDesignator
    range: rdf_literal
    multivalued: true
  locator_name:
    slot_uri: locn:locatorName
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}
  po_box:
    slot_uri: locn:poBox
    range: rdf_literal
    multivalued: true
  post_code:
    slot_uri: locn:postCode
    range: rdf_literal
    multivalued: true
  post_name:
    slot_uri: locn:postName
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}
  thoroughfare:
    slot_uri: locn:thoroughfare
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}

  code:
    slot_uri: m8g:code
    range: Code
    multivalued: true
  level:
    slot_uri: m8g:level
    range: Code
    multivalued: true
  label:
    slot_uri: rdfs:label
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}

  agent_name:
    slot_uri: dct:title
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}
  agent_type:
    slot_uri: dct:type
    range: Code
    multivalued: true

  contact_page:
    slot_uri: m8g:contactPage
    range: Document
    multivalued: true
  email:
    slot_uri: m8g:email
    range: rdf_literal
    multivalued: true
  telephone:
    slot_uri: m8g:telephone
    range: rdf_literal
    multivalued: true

  identifies:
    slot_uri: m8g:identifies
    range: Person
    multivalued: true
  issued_by:
    slot_uri: dct:creator
    range: Agent
    multivalued: true
  date_issued:
    slot_uri: dct:issued
    range: date
    multivalued: true
  notation:
    slot_uri: skos:notation
    range: rdf_literal
    multivalued: true
  scheme_agency:
    slot_uri: adms:schemeAgency
    range: rdf_literal
    multivalued: true

  jurisdiction_identifier:
    slot_uri: dct:identifier
    range: any_uri_literal
    multivalued: true
  geographic_identifier:
    slot_uri: rdfs:seeAlso
    range: any_uri_literal
    multivalued: true
  geographic_name:
    slot_uri: locn:geographicName
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}

  date_of_birth:
    slot_uri: m8g:birthDate
    range: rdf_literal
    multivalued: true
    description: >-
      Official SHACL constrains only the RDF node kind to Literal. The documented
      GenericDate union is not imposed pending a SEMIC Working Group decision.
  contact_point:
    slot_uri: m8g:contactPoint
    range: ContactPoint
    multivalued: true
  date_of_death:
    slot_uri: m8g:deathDate
    range: rdf_literal
    multivalued: true
    description: >-
      Official SHACL constrains only the RDF node kind to Literal. The documented
      GenericDate union is not imposed pending a SEMIC Working Group decision.
  domicile:
    slot_uri: m8g:domicile
    range: Address
    multivalued: true
  gender:
    slot_uri: m8g:gender
    range: Code
    multivalued: true
  matronymic_name:
    slot_uri: m8g:matronymicName
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}
  sex:
    slot_uri: m8g:sex
    range: Code
    multivalued: true
  alternative_name:
    slot_uri: dct:alternative
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}
  person_identifier:
    slot_uri: dct:identifier
    range: Identifier
    multivalued: true
  birth_name:
    slot_uri: person:birthName
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}
  citizenship:
    slot_uri: person:citizenship
    range: Jurisdiction
    multivalued: true
  country_of_birth:
    slot_uri: person:countryOfBirth
    range: Location
    multivalued: true
  country_of_death:
    slot_uri: person:countryOfDeath
    range: Location
    multivalued: true
  patronymic_name:
    slot_uri: person:patronymicName
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}
  place_of_birth:
    slot_uri: person:placeOfBirth
    range: Location
    multivalued: true
  place_of_death:
    slot_uri: person:placeOfDeath
    range: Location
    multivalued: true
  residency:
    slot_uri: person:residency
    range: Jurisdiction
    multivalued: true
  family_name:
    slot_uri: foaf:familyName
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}
  given_name:
    slot_uri: foaf:givenName
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}
  full_name:
    slot_uri: foaf:name
    range: lang_string
    multivalued: true
    annotations: {semic_unique_lang: true}

classes:
  Address:
    class_uri: locn:Address
    slots:
      - administrative_unit
      - address_area
      - address_id
      - admin_unit_l1
      - admin_unit_l2
      - full_address
      - locator_designator
      - locator_name
      - po_box
      - post_code
      - post_name
      - thoroughfare
  AdministrativeUnit:
    title: Administrative Unit
    class_uri: m8g:AdminUnit
    slots: [code, level, label]
  Agent:
    class_uri: foaf:Agent
    slots: [agent_name, agent_type]
  Code:
    class_uri: skos:Concept
  ContactPoint:
    title: Contact Point
    class_uri: m8g:ContactPoint
    slots: [contact_page, email, telephone]
  Document:
    class_uri: foaf:Document
  GenericDate:
    title: Generic Date
    class_uri: m8g:GenericDate
    description: >-
      Published vocabulary describes date, gYearMonth or gYear; official SHACL
      currently provides no constraints on this class.
  Identifier:
    class_uri: adms:Identifier
    slots: [identifies, issued_by, date_issued, notation, scheme_agency]
  Jurisdiction:
    class_uri: dct:Jurisdiction
    slots: [jurisdiction_identifier, label]
  Location:
    class_uri: dct:Location
    slots: [geographic_identifier, geographic_name]
  Person:
    class_uri: person:Person
    slots:
      - date_of_birth
      - contact_point
      - date_of_death
      - domicile
      - gender
      - matronymic_name
      - sex
      - alternative_name
      - person_identifier
      - birth_name
      - citizenship
      - country_of_birth
      - country_of_death
      - patronymic_name
      - place_of_birth
      - place_of_death
      - residency
      - family_name
      - given_name
      - full_name
