# Configuration of generators (defaults illustrated)
---
# The directory where the generated files are stored
# directory: "tmp"

# Only run the generators we ship as published artefacts under project/.
# Everything else (excel, graphql, prefixmap, proto, shex, typescript,
# java, markdown) is omitted to keep the published surface small. The
# `python` generator is included because its output is moved out of
# project/ into src/core_person/datamodel/ by the justfile. The OWL
# generator is included here but is also re-invoked separately by the
# justfile with extra flags (`--metadata-profile rdfs`,
# `--ontology-uri-suffix ''`, vacuous-axiom skips) that aren't
# expressible in this config — see config.public.mk
# (LINKML_GENERATORS_OWL_ARGS). Per-class/per-slot Markdown for the
# docs site is produced by `just gen-doc` (gen-doc, not gen-project)
# and lands under `docs/elements/`.
includes:
  - jsonld
  - jsonldcontext
  - jsonschema
  - owl
  - shacl
  - sqltable
  - python

# Set the arguments for the generators (no matter if they run or not)
generator_args:
  excel:
    mergeimports: true
  owl:
    mergeimports: true
    metaclasses: false
    type_objects: false
    add_root_classes: true
    mixins_as_expressions: true
    # Emit class IRIs based on class_uri (e.g. person:Person) rather
    # than the schema's default-prefix native IRI (cpv:Person). This
    # matches the upstream SEMIC Core Person vocabulary identifiers.
    # Note: this only affects the gen-project OWL pass — the justfile's
    # separate gen-owl call also passes `--no-use-native-uris`, so the
    # final OWL output is consistent either way.
    use_native_uris: false
  markdown:
    mergeimports: true
    directory: "docs/elements"
  graphql:
    mergeimports: true
  # gen-java is not yet supported by gen-project.
  #   https://github.com/linkml/linkml/issues/2537
  # java:
  #   mergeimports: true
  #   metadata: true
  jsonld:
    mergeimports: true
  jsonschema:
    mergeimports: true
  jsonldcontext:
    mergeimports: true
  # gen-pydantic is not yet supported by gen-project.
  #   https://github.com/linkml/linkml/issues/2537
  # pydantic:
  #   mergeimports: true
  python:
    mergeimports: true
    # head: true  # Why does this not work?
  prefixmap:
    mergeimports: true
  proto:
    mergeimports: true
  shacl:
    mergeimports: true
    # Match SEMIC Core Person semantics: open shapes (no sh:closed true).
    # Mixin/abstract classes already get sh:closed false; this flag
    # turns it off uniformly. See COMPARISON.md.
    closed: false
    # Append 'Shape' to class_uri-derived shape IRIs to match the
    # upstream convention (e.g. person:Person -> person:PersonShape).
    # Available since linkml main (gen-shacl --suffix).
    suffix: Shape
    # include_annotations honours schema-level slot/class `annotations:`
    # blocks (e.g. for emitting `rdfs:seeAlso` HTML spec anchors on each
    # property shape). Without this flag, those annotations are silently
    # dropped from the SHACL output.
    include_annotations: true
  shex:
    mergeimports: true
  sqlddl:
    mergeimports: true
  typescript:
    mergeimports: true
    metadata: true

...
