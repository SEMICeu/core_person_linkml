schema_version: 1
pilot: core-person-2.1.2
authority:
  shacl_artifact: core-person-shacl
  vocabulary_artifact: core-person-vocabulary
  jsonld_context_artifact: core-person-context
linkml:
  canonical_schema: src/core_person/schema/core_person.yaml
  editing_wrapper: src/core_person/schema/core_person_dataset.yaml
  publication_wrapper_included: false
generator_profile:
  open_shapes: true
  semic_extensions: true
  class_uri_names: true
decisions:
  CP-DEC-001:
    status: pilot
    subject: language uniqueness
    resolution: Preserve all 18 official sh:uniqueLang constraints through the SEMIC adapter.
  CP-DEC-002:
    status: working-group-required
    subject: GenericDate
    resolution: >-
      Pilot follows authoritative SHACL and constrains birth/death dates only to
      RDF literals. The documented date/gYearMonth/gYear union is not imposed.
  CP-DEC-003:
    status: pilot
    subject: object identifiers
    resolution: >-
      Canonical classes have no artificial LinkML identifier because official
      object ranges allow both blank nodes and IRIs.
  CP-DEC-004:
    status: pilot
    subject: property-shape identity
    resolution: >-
      Compare normalized constraint behaviour; official hashed property-shape
      IRIs are retained as provenance but are not regenerated by stock LinkML.
extensions:
  semic_unique_lang:
    source_component: sh:uniqueLang
    implementation: src/core_person/baseline.py#apply_semic_shacl_extensions
  rdf_literal:
    source_component: sh:nodeKind sh:Literal
    implementation: src/core_person/baseline.py#apply_semic_shacl_extensions
  any_uri_literal:
    source_components:
      - sh:nodeKind sh:Literal
      - sh:datatype xsd:anyURI
    implementation: src/core_person/baseline.py#apply_semic_shacl_extensions
acceptance:
  official_node_shapes: 15
  official_property_shapes: 106
  consolidated_class_path_rules: 49
  constraint_inventory_required_equal:
    - sh:class
    - sh:datatype
    - sh:nodeKind
    - sh:uniqueLang
    - sh:closed
  graph_isomorphism_expected: false
  reason: Official constraints use separate named hash-IRI property shapes.
