# Minimal valid Person — all slots are optional, so only those used
# below need values. Picked to exercise three different slot kinds:
# a `LangString`-ranged slot (`fullName`), an object-ranged slot
# (`countryOfBirth` → Location), and the `any_of` date disjunction
# (`dateOfBirth`).
fullName:
  - Alice Example
countryOfBirth:
  - geographicName:
      - Wonderland
dateOfBirth:
  - "1990-01-15"
